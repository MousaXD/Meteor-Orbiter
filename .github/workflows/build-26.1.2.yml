name: Build 26.1.2

on:
  push:
    branches: ["26.1.2"]
  pull_request:
    branches: ["26.1.2"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply 26.1.2 compatibility migration
        run: python3 scripts/port_26_1_2_compat.py

      - name: Commit migrated source
        if: github.event_name == 'push'
        run: |
          if ! git diff --quiet -- src/main/java; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/main/java
            git commit -m "port: reverse 26.2 APIs for 26.1.2"
            git push
          fi

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace

      - name: Upload addon jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: meteor-orbiter-26.1.2
          path: build/libs/*.jar
